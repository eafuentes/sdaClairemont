name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, contrast and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v6

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Reads the palette straight out of the theme, so a colour change that drops a
      # pair below its WCAG floor fails here rather than in an audit after launch.
      - name: Check colour contrast
        run: pnpm check:contrast

      # No environment variables are configured here, deliberately. Environment
      # validation is lazy and grouped (src/env.ts), so a build with no credentials
      # is a meaningful signal rather than a missing-secret failure.
      - name: Build
        run: pnpm build
